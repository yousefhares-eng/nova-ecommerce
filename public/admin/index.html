<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin – NOVA</title>
  <link rel="stylesheet" href="/css/main.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="/" class="logo">NOVA</a>
      <nav class="nav-links">
        <a href="/">Home</a>
        <a href="/shop">Shop</a>
        <a href="/admin" class="active">Admin</a>
      </nav>
      <div class="header-actions">
        <a href="/" class="btn btn-ghost btn-sm">View store</a>
        <button type="button" class="btn btn-ghost btn-sm" id="nav-logout">Logout</button>
      </div>
    </div>
  </header>

  <div class="admin-layout">
    <aside class="admin-sidebar">
      <h3>Admin</h3>
      <nav>
        <a href="/admin" class="active">Dashboard</a>
        <a href="/admin/products">Products</a>
        <a href="/admin/orders">Orders</a>
      </nav>
    </aside>
    <main class="admin-main">
      <h1>Dashboard</h1>
      <div id="admin-error" class="alert alert-error" style="display:none;"></div>
      <div id="admin-stats" class="admin-stats"></div>
      <h2 style="font-size: var(--text-lg); margin-bottom: var(--space-4);">Recent orders</h2>
      <div id="admin-orders-table"></div>
    </main>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/app.js"></script>
  <script>
    (function () {
      const user = typeof getUser === 'function' ? getUser() : null;
      if (!user || user.role !== 'admin') {
        window.location.href = '/login?redirect=' + encodeURIComponent('/admin');
        return;
      }

      document.getElementById('nav-logout').addEventListener('click', function () {
        logout();
      });

      async function load() {
        try {
          const { data } = await api('/api/admin/dashboard');
          const stats = data.stats || {};
          document.getElementById('admin-stats').innerHTML =
            '<div class="admin-stat"><div class="value">' + (stats.orders || 0) + '</div><div class="label">Orders</div></div>' +
            '<div class="admin-stat"><div class="value">' + (stats.products || 0) + '</div><div class="label">Products</div></div>' +
            '<div class="admin-stat"><div class="value">' + (stats.users || 0) + '</div><div class="label">Users</div></div>' +
            '<div class="admin-stat"><div class="value">$' + Number(stats.revenue || 0).toFixed(2) + '</div><div class="label">Revenue</div></div>';

          const orders = data.recentOrders || [];
          if (!orders.length) {
            document.getElementById('admin-orders-table').innerHTML = '<p style="color: var(--text-muted);">No orders yet.</p>';
          } else {
            document.getElementById('admin-orders-table').innerHTML =
              '<table class="admin-table">' +
              '<thead><tr><th>Order</th><th>Email</th><th>Total</th><th>Status</th><th>Date</th></tr></thead><tbody>' +
              orders.map(function (o) {
                return '<tr><td><a href="/admin/orders">' + (o.orderNumber || o._id) + '</a></td><td>' + (o.email || '') + '</td><td>$' + Number(o.total || 0).toFixed(2) + '</td><td>' + (o.status || '') + '</td><td>' + (o.createdAt ? new Date(o.createdAt).toLocaleDateString() : '') + '</td></tr>';
              }).join('') +
              '</tbody></table>';
          }
        } catch (e) {
          document.getElementById('admin-error').textContent = e.message || 'Failed to load dashboard.';
          document.getElementById('admin-error').style.display = 'block';
        }
      }
      load();
    })();
  </script>
</body>
</html>
