<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Orders – NOVA</title>
  <link rel="stylesheet" href="/css/main.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="/" class="logo">NOVA</a>
      <nav class="nav-links">
        <a href="/">Home</a>
        <a href="/shop">Shop</a>
        <a href="/admin">Admin</a>
      </nav>
      <div class="header-actions">
        <a href="/" class="btn btn-ghost btn-sm">View store</a>
        <button type="button" class="btn btn-ghost btn-sm" id="nav-logout">Logout</button>
      </div>
    </div>
  </header>

  <div class="admin-layout">
    <aside class="admin-sidebar">
      <h3>Admin</h3>
      <nav>
        <a href="/admin">Dashboard</a>
        <a href="/admin/products">Products</a>
        <a href="/admin/orders" class="active">Orders</a>
      </nav>
    </aside>
    <main class="admin-main">
      <h1>Orders</h1>
      <div id="admin-error" class="alert alert-error" style="display:none;"></div>
      <div id="admin-success" class="alert alert-success" style="display:none;"></div>
      <div id="orders-table-wrap"></div>

      <!-- Order detail modal -->
      <div id="order-modal" style="display:none; position:fixed; inset:0; background: rgba(0,0,0,0.6); z-index: 1000; align-items: center; justify-content: center; padding: var(--space-4);">
        <div style="background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); max-width: 560px; width: 100%; max-height: 90vh; overflow-y: auto;">
          <div style="padding: var(--space-6);">
            <h2 id="order-modal-title" style="margin-bottom: var(--space-4);">Order</h2>
            <div id="order-modal-body"></div>
            <div class="form-group" style="margin-top: var(--space-4);">
              <label>Status</label>
              <select id="order-status-select" class="form-control">
                <option value="pending">Pending</option>
                <option value="confirmed">Confirmed</option>
                <option value="processing">Processing</option>
                <option value="shipped">Shipped</option>
                <option value="delivered">Delivered</option>
                <option value="cancelled">Cancelled</option>
              </select>
            </div>
            <div style="display: flex; gap: var(--space-3); margin-top: var(--space-4);">
              <button type="button" class="btn btn-primary" id="order-status-save">Update status</button>
              <button type="button" class="btn btn-outline" id="order-modal-close">Close</button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/app.js"></script>
  <script>
    (function () {
      const user = typeof getUser === 'function' ? getUser() : null;
      if (!user || user.role !== 'admin') {
        window.location.href = '/login?redirect=' + encodeURIComponent('/admin/orders');
        return;
      }
      document.getElementById('nav-logout').addEventListener('click', function () { logout(); });

      const errEl = document.getElementById('admin-error');
      const successEl = document.getElementById('admin-success');
      const wrap = document.getElementById('orders-table-wrap');
      const modal = document.getElementById('order-modal');
      const modalBody = document.getElementById('order-modal-body');
      const statusSelect = document.getElementById('order-status-select');
      let currentOrderId = null;

      function showErr(msg) {
        successEl.style.display = 'none';
        errEl.textContent = msg;
        errEl.style.display = 'block';
      }
      function showSuccess(msg) {
        errEl.style.display = 'none';
        successEl.textContent = msg;
        successEl.style.display = 'block';
      }

      async function loadOrders() {
        try {
          const { data } = await api('/api/admin/orders');
          const orders = data.orders || [];
          if (!orders.length) {
            wrap.innerHTML = '<p style="color: var(--text-muted);">No orders yet.</p>';
            return;
          }
          wrap.innerHTML =
            '<table class="admin-table">' +
            '<thead><tr><th>Order</th><th>Email</th><th>Total</th><th>Status</th><th>Date</th><th></th></tr></thead><tbody>' +
            orders.map(function (o) {
              const date = o.createdAt ? new Date(o.createdAt).toLocaleString() : '';
              return '<tr><td>' + (o.orderNumber || o._id) + '</td><td>' + (o.email || '') + '</td><td>$' + Number(o.total || 0).toFixed(2) + '</td><td>' + (o.status || '') + '</td><td>' + date + '</td><td><button type="button" class="btn btn-outline btn-sm view-order-btn" data-id="' + o._id + '">View</button></td></tr>';
            }).join('') +
            '</tbody></table>';

          wrap.querySelectorAll('.view-order-btn').forEach(function (btn) {
            btn.addEventListener('click', function () { openOrder(btn.dataset.id); });
          });
        } catch (e) {
          showErr(e.message || 'Failed to load orders.');
        }
      }

      async function openOrder(id) {
        currentOrderId = id;
        try {
          const { data } = await api('/api/admin/orders/' + id);
          const o = data.order;
          document.getElementById('order-modal-title').textContent = 'Order ' + (o.orderNumber || o._id);
          statusSelect.value = o.status || 'pending';

          const addr = o.shippingAddress || {};
          const addrStr = [addr.name, addr.street, addr.city, addr.state, addr.zip, addr.country].filter(Boolean).join(', ');
          const itemsHtml = (o.items || []).map(function (it) {
            return '<tr><td>' + (it.name || '') + '</td><td>' + (it.quantity || 0) + '</td><td>' + (it.size || '') + '</td><td>' + (it.color || '') + '</td><td>$' + Number((it.price || 0) * (it.quantity || 0)).toFixed(2) + '</td></tr>';
          }).join('');

          modalBody.innerHTML =
            '<p><strong>Email:</strong> ' + (o.email || '') + '</p>' +
            '<p><strong>Shipping:</strong> ' + (addrStr || '—') + '</p>' +
            '<p><strong>Subtotal:</strong> $' + Number(o.subtotal || 0).toFixed(2) + ' &nbsp; <strong>Shipping:</strong> $' + Number(o.shipping || 0).toFixed(2) + ' &nbsp; <strong>Total:</strong> $' + Number(o.total || 0).toFixed(2) + '</p>' +
            '<table class="admin-table" style="margin-top: var(--space-4);"><thead><tr><th>Item</th><th>Qty</th><th>Size</th><th>Color</th><th>Total</th></tr></thead><tbody>' + itemsHtml + '</tbody></table>';
          modal.style.display = 'flex';
        } catch (e) {
          showErr(e.message || 'Failed to load order.');
        }
      }

      document.getElementById('order-modal-close').addEventListener('click', function () {
        modal.style.display = 'none';
        currentOrderId = null;
      });

      document.getElementById('order-status-save').addEventListener('click', async function () {
        if (!currentOrderId) return;
        const status = statusSelect.value;
        try {
          await api('/api/admin/orders/' + currentOrderId + '/status', { method: 'PATCH', body: { status } });
          showSuccess('Status updated.');
          modal.style.display = 'none';
          currentOrderId = null;
          loadOrders();
        } catch (e) {
          showErr(e.message || 'Failed to update status.');
        }
      });

      loadOrders();
    })();
  </script>
</body>
</html>
