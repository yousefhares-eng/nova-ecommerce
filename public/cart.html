<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cart – NOVA</title>
  <link rel="stylesheet" href="/css/main.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="/" class="logo">NOVA</a>
      <nav class="nav-links">
        <a href="/">Home</a>
        <a href="/shop" class="active">Shop</a>
        <a href="/contact">Contact</a>
        <a href="/admin" id="nav-admin" style="display:none">Admin</a>
      </nav>
      <div class="header-actions">
        <a href="/cart" class="cart-link">Cart <span id="cart-count" class="cart-count" style="display:none">0</span></a>
        <a href="/login" id="nav-login">Login</a>
        <a href="/register" id="nav-register">Register</a>
        <button type="button" class="btn btn-ghost btn-sm" id="nav-logout" style="display:none">Logout</button>
      </div>
    </div>
  </header>

  <main>
    <div class="cart-page container">
      <h1>Your cart</h1>
      <div id="cart-empty" class="cart-empty" style="display:none">
        <p>Your cart is empty.</p>
        <a href="/shop" class="btn btn-primary">Continue shopping</a>
      </div>
      <div id="cart-content" style="display:none">
        <div id="cart-items"></div>
        <div class="cart-summary">
          <h2>Summary</h2>
          <div class="row"><span>Subtotal</span><span id="cart-subtotal">$0</span></div>
          <div class="row"><span>Shipping</span><span id="cart-shipping">$0</span></div>
          <div class="row total"><span>Total</span><span id="cart-total">$0</span></div>
          <a href="/checkout" class="btn btn-primary">Checkout</a>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-col"><h4>Shop</h4><a href="/shop">All Products</a><a href="/contact">Contact</a></div>
      <div class="footer-col"><h4>Support</h4><a href="/contact">Contact</a></div>
      <div class="footer-col"><h4>NOVA</h4><p>Premium modern streetwear.</p></div>
    </div>
    <div class="footer-bottom">&copy; 2025 NOVA.</div>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/app.js"></script>
  <script>
    (function () {
      const empty = document.getElementById('cart-empty');
      const content = document.getElementById('cart-content');
      const itemsEl = document.getElementById('cart-items');
      const subtotalEl = document.getElementById('cart-subtotal');
      const shippingEl = document.getElementById('cart-shipping');
      const totalEl = document.getElementById('cart-total');

      function render() {
        const items = getCart();
        if (!items.length) {
          empty.style.display = 'block';
          content.style.display = 'none';
          return;
        }
        empty.style.display = 'none';
        content.style.display = 'block';

        const sub = cartSubtotal();
        const ship = sub >= 100 ? 0 : 9.99;
        const tot = sub + ship;

        itemsEl.innerHTML = items.map(function (x) {
          const meta = [x.size, x.color].filter(Boolean).join(' · ') || '—';
          return (
            '<div class="cart-item" data-id="' + x.productId + '" data-size="' + (x.size || '') + '" data-color="' + (x.color || '') + '">' +
            '  <div class="cart-item-image"><img src="' + (x.image || '/images/placeholder.svg') + '" alt="" /></div>' +
            '  <div class="cart-item-details">' +
            '    <h3><a href="/product?id=' + x.productId + '">' + (x.name || '') + '</a></h3>' +
            '    <div class="meta">' + meta + ' · Qty ' + x.quantity + '</div>' +
            '  </div>' +
            '  <div class="cart-item-price">$' + (x.price * x.quantity).toFixed(2) + '</div>' +
            '  <div class="cart-item-actions">' +
            '    <button type="button" class="cart-remove">Remove</button>' +
            '  </div>' +
            '</div>'
          );
        }).join('');

        subtotalEl.textContent = '$' + sub.toFixed(2);
        shippingEl.textContent = ship === 0 ? 'Free' : '$' + ship.toFixed(2);
        totalEl.textContent = '$' + tot.toFixed(2);

        itemsEl.querySelectorAll('.cart-remove').forEach(function (btn) {
          btn.addEventListener('click', function () {
            const row = btn.closest('.cart-item');
            const id = row.dataset.id;
            const size = row.dataset.size || '';
            const color = row.dataset.color || '';
            removeFromCart(id, size, color);
            render();
            if (typeof window.novaUpdateCartCount === 'function') window.novaUpdateCartCount();
          });
        });
      }
      render();
    })();
  </script>
</body>
</html>
