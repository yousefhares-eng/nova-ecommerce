<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product – NOVA</title>
  <link rel="stylesheet" href="/css/main.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="/" class="logo">NOVA</a>
      <nav class="nav-links">
        <a href="/">Home</a>
        <a href="/shop" class="active">Shop</a>
        <a href="/contact">Contact</a>
        <a href="/admin" id="nav-admin" style="display:none">Admin</a>
      </nav>
      <div class="header-actions">
        <a href="/cart" class="cart-link">Cart <span id="cart-count" class="cart-count" style="display:none">0</span></a>
        <a href="/login" id="nav-login">Login</a>
        <a href="/register" id="nav-register">Register</a>
        <button type="button" class="btn btn-ghost btn-sm" id="nav-logout" style="display:none">Logout</button>
      </div>
    </div>
  </header>

  <main>
    <div id="product-root" class="container">
      <div id="product-loading" style="text-align:center; padding: var(--space-16); color: var(--text-muted);">Loading…</div>
      <div id="product-error" style="display:none; text-align:center; padding: var(--space-16); color: var(--danger);"></div>
      <div id="product-detail" style="display:none;"></div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-col"><h4>Shop</h4><a href="/shop">All Products</a><a href="/contact">Contact</a></div>
      <div class="footer-col"><h4>Support</h4><a href="/contact">Contact</a></div>
      <div class="footer-col"><h4>NOVA</h4><p>Premium modern streetwear.</p></div>
    </div>
    <div class="footer-bottom">&copy; 2025 NOVA.</div>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/app.js"></script>
  <script>
    (function () {
      const id = new URL(location.href).searchParams.get('id');
      const loading = document.getElementById('product-loading');
      const errEl = document.getElementById('product-error');
      const detail = document.getElementById('product-detail');

      if (!id) {
        loading.style.display = 'none';
        errEl.style.display = 'block';
        errEl.textContent = 'Product not found.';
        return;
      }

      async function load() {
        try {
          const { data } = await api('/api/products/' + id);
          const p = data.product;
          loading.style.display = 'none';
          errEl.style.display = 'none';
          detail.style.display = 'block';

          const images = (p.images && p.images.length) ? p.images : ['/images/placeholder.svg'];
          const img = images[0];
          const sizes = (p.sizes && p.sizes.length) ? p.sizes : ['One Size'];
          const colors = (p.colors && p.colors.length) ? p.colors : ['Default'];
          const stock = Number(p.stock) || 0;
          const inStock = stock > 0;
          const stockLabel = inStock
            ? (stock <= 5 ? 'Only ' + stock + ' left in stock' : stock + ' in stock')
            : 'Out of stock';
          const priceHtml = p.compareAtPrice
            ? '<del>$' + Number(p.compareAtPrice).toFixed(2) + '</del> $' + Number(p.price).toFixed(2)
            : '$' + Number(p.price).toFixed(2);

          detail.innerHTML =
            '<div class="product-detail">' +
            '  <div>' +
            '    <div class="product-gallery"><img id="product-main-image" src="' + img + '" alt="' + (p.name || '') + '" /></div>' +
            '    <div class="gallery-thumbs">' + images.map(function (image, index) { return '<button type="button" class="gallery-thumb ' + (index === 0 ? 'active' : '') + '" data-image="' + image + '"><img src="' + image + '" alt="View ' + (index + 1) + '" /></button>'; }).join('') + '</div>' +
            '  </div>' +
            '  <div class="product-info">' +
            '    <h1>' + (p.name || '') + '</h1>' +
            '    <div class="price">' + priceHtml + '</div>' +
            '    <p class="stock-label" style="color:' + (inStock ? 'var(--success)' : 'var(--danger)') + '; margin-bottom: var(--space-4);">' + stockLabel + '</p>' +
            '    <div class="description">' + (p.description || '') + '</div>' +
            '    <div class="product-options">' +
            '      <label>Size</label>' +
            '      <select id="opt-size">' + sizes.map(function (s) { return '<option value="' + s + '">' + s + '</option>'; }).join('') + '</select>' +
            '      <label>Color <span id="selected-color" class="form-hint">' + colors[0] + '</span></label>' +
            '      <div id="color-swatches" class="swatch-grid">' + colors.map(function (c, index) { return '<button type="button" class="color-swatch ' + (index === 0 ? 'active' : '') + '" data-color="' + c + '" data-image="' + images[index % images.length] + '"><span class="swatch-dot" style="--swatch:' + c.toLowerCase() + ';"></span><span>' + c + '</span></button>'; }).join('') + '</div>' +
            '      <select id="opt-color" class="visually-hidden" aria-hidden="true">' + colors.map(function (c) { return '<option value="' + c + '">' + c + '</option>'; }).join('') + '</select>' +
            '    </div>' +
            '    <div class="add-to-cart-row">' +
            '      <input type="number" id="opt-qty" class="qty" min="1" max="' + Math.max(stock, 1) + '" value="1" ' + (inStock ? '' : 'disabled') + ' />' +
            '      <button type="button" class="btn btn-primary" id="btn-add" ' + (inStock ? '' : 'disabled') + '>' + (inStock ? 'Add to cart' : 'Out of stock') + '</button>' +
            '    </div>' +
            '  </div>' +
            '</div>';

          const mainImage = document.getElementById('product-main-image');
          document.querySelectorAll('.gallery-thumb').forEach(function (thumb) {
            thumb.addEventListener('click', function () {
              mainImage.src = thumb.dataset.image;
              document.querySelectorAll('.gallery-thumb').forEach(function (item) { item.classList.remove('active'); });
              thumb.classList.add('active');
            });
          });
          document.querySelectorAll('.color-swatch').forEach(function (swatch) {
            swatch.addEventListener('click', function () {
              document.getElementById('opt-color').value = swatch.dataset.color;
              document.getElementById('selected-color').textContent = swatch.dataset.color;
              mainImage.src = swatch.dataset.image;
              document.querySelectorAll('.color-swatch').forEach(function (item) { item.classList.remove('active'); });
              swatch.classList.add('active');
            });
          });

          document.getElementById('btn-add').addEventListener('click', function () {
            const size = document.getElementById('opt-size').value;
            const color = document.getElementById('opt-color').value;
            const qtyInput = document.getElementById('opt-qty');
            const qty = Math.max(1, parseInt(qtyInput.value, 10) || 1);
            if (qty > stock) {
              alert('Only ' + stock + ' item(s) available.');
              qtyInput.value = stock;
              return;
            }
            addToCart({
              productId: p._id,
              name: p.name,
              image: img,
              price: p.price,
              quantity: qty,
              size: size,
              color: color
            });
            if (typeof window.novaUpdateCartCount === 'function') window.novaUpdateCartCount();
            window.location.href = '/cart';
          });
        } catch (e) {
          loading.style.display = 'none';
          errEl.style.display = 'block';
          errEl.textContent = e.message || 'Product not found.';
        }
      }
      load();
    })();
  </script>
</body>
</html>
