<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – NOVA</title>
  <link rel="stylesheet" href="/css/main.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="/" class="logo">NOVA</a>
      <nav class="nav-links">
        <a href="/">Home</a>
        <a href="/shop">Shop</a>
        <a href="/contact">Contact</a>
      </nav>
      <div class="header-actions">
        <a href="/cart" class="cart-link">Cart <span id="cart-count" class="cart-count" style="display:none">0</span></a>
        <a href="/login" class="active">Login</a>
        <a href="/register">Register</a>
      </div>
    </div>
  </header>

  <main>
    <div class="auth-page">
      <div class="auth-card">
        <h1>Login</h1>
        <p class="sub">Sign in to your NOVA account.</p>
        <div id="auth-error" class="alert alert-error" style="display:none;"></div>
        <form id="login-form">
          <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" class="form-control" required placeholder="you@example.com" />
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" class="form-control" required placeholder="••••••••" />
          </div>
          <button type="submit" class="btn btn-primary" id="btn-submit">Sign in</button>
        </form>
        <p class="footer-link">Don't have an account? <a href="/register">Register</a></p>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-col"><h4>Shop</h4><a href="/shop">All Products</a><a href="/contact">Contact</a></div>
      <div class="footer-col"><h4>Support</h4><a href="/contact">Contact</a></div>
      <div class="footer-col"><h4>NOVA</h4><p>Premium modern streetwear.</p></div>
    </div>
    <div class="footer-bottom">&copy; 2025 NOVA.</div>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/app.js"></script>
  <script>
    (function () {
      const form = document.getElementById('login-form');
      const errEl = document.getElementById('auth-error');
      const btn = document.getElementById('btn-submit');
      const params = new URL(location.href).searchParams;
      const redirect = params.get('redirect') || '/';

      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        errEl.style.display = 'none';
        btn.disabled = true;
        const email = form.querySelector('input[name="email"]').value.trim();
        const password = form.querySelector('input[name="password"]').value;
        try {
          await login(email, password);
          window.location.href = redirect;
        } catch (err) {
          errEl.textContent = err.message || 'Login failed.';
          errEl.style.display = 'block';
          btn.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
